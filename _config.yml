# ----
# Site

title: Equipe
description: API documentation for Equipe https://app.equipe.com
url: http://api-docs.equipe.com
google_analytics_key:
permalink: pretty

collections:
  documentation:
    title: Documentation
    position: 1
  federation_api:
    title: Federation APIs
    description: The web services you build. Equipe calls them when a user imports entries, searches or sends results.
    position: 2
  models:
    title: Federation Models
    description: The records in the entries we import and the results we send.
    position: 3
  api:
    title: APIs
    description: Equipe's own API, which your system calls.
    position: 4
  more:
    title: More
    position: 5

plugins:
  - jekyll-sitemap
  - jekyll-seo-tag

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

defaults:
  -
    scope:
      path: ""
    values:
      layout: default

types:
  - get
  - put
  - delete
  - post
