<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#353851">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Fragment+Mono&display=swap">
    <link rel="stylesheet" href="/css/style.css">
    {% seo %}

    {% if jekyll.environment == 'production' %}
      <script>
        (function(i,s,o,g,r,a,m){i["GoogleAnalyticsObject"]=r;i[r]=i[r]||function(){
        (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
        m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
      })(window,document,"script","//www.google-analytics.com/analytics.js","ga");
        ga("create", "{{ site.google_analytics_key }}", "auto");
        ga("send", "pageview");
      </script>
    {% endif %}

    <link rel="apple-touch-icon" type="image/png" href="https://dj1cafo87npm1.cloudfront.net/assets/apple-touch-icon-d742674fa00a3b57189159c0ca5926ed3014180780ed5f167243332434a3cac1.png"/>
    <link rel="apple-touch-icon" type="image/png" href="https://dj1cafo87npm1.cloudfront.net/assets/apple-touch-icon-120x120-d2d9786498a9f5b57fc64a77aa588426978b2ddb528b6191769f9f855296195e.png" sizes="120x120"/>
    <link rel="apple-touch-icon" type="image/png" href="https://dj1cafo87npm1.cloudfront.net/assets/apple-touch-icon-152x152-b3ffac005eae0b5cc21f65efaba63550eaa779b86d43458c76677eb57b80b035.png" sizes="152x152"/>
    <link rel="apple-touch-icon" type="image/png" href="https://dj1cafo87npm1.cloudfront.net/assets/apple-touch-icon-180x180-dc626103456fdc8399dce4176b8ac45f122ff578f04b8d607acad2f6b753a796.png" sizes="180x180"/>
    <link rel="icon" type="image/png" href="https://dj1cafo87npm1.cloudfront.net/assets/icon-44ad89979b9e75e95318866acc4ccfbd88c80ea01869c9f144660cb231059cf3.png" sizes="128x128"/>
    <link rel="icon" type="image/png" href="https://dj1cafo87npm1.cloudfront.net/assets/icon-hd-d742674fa00a3b57189159c0ca5926ed3014180780ed5f167243332434a3cac1.png" sizes="192x192"/>
  </head>
  <body>
    <header class="topbar">
      <button type="button" class="open-nav" id="open-nav" aria-controls="sidebar" aria-expanded="false" aria-label="Contents">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="/">
        <img src="/images/logo.svg" alt="{{ site.title }}">
        <span class="brand-name">API</span>
      </a>
      <form class="search" action="/search/" method="get" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input type="search" name="q" id="search-input" placeholder="Search the docs" aria-label="Search the docs">
      </form>
      <a class="topbar-link" href="https://app.equipe.com">app.equipe.com</a>
    </header>

    <nav id="sidebar" class="sidebar" aria-label="Contents">
      {% include sidebar.html %}
      <p class="sidebar-foot">
        <a href="https://cloudcannon.com/">Template by CloudCannon</a>
      </p>
    </nav>

    <main class="main">
      {{ content }}
    </main>

    <script src="/js/main.js"></script>
  </body>
</html>
